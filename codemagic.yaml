workflows:
  android-debug:
    name: ProPDF Editor Debug Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 17
      vars:
        GRADLE_VERSION: "8.2"
    cache:
      cache_paths:
        - ~/.gradle/caches
    scripts:
      - name: Make gradlew executable
        script: |
          chmod +x gradlew
          echo "gradlew is now executable"

      - name: Setup project structure
        script: |
          # Create all required source directories
          mkdir -p app/src/main/java/com/propdf/editor/ui/viewer
          mkdir -p app/src/main/java/com/propdf/editor/ui/tools
          mkdir -p app/src/main/java/com/propdf/editor/ui/scanner
          mkdir -p app/src/main/java/com/propdf/editor/ui/main
          mkdir -p app/src/main/java/com/propdf/editor/data/repository
          mkdir -p app/src/main/java/com/propdf/editor/data/local
          mkdir -p app/src/main/java/com/propdf/editor/di
          mkdir -p app/src/main/java/com/propdf/editor/utils
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/menu

          # --- UI/Viewer ---
          cp ViewerActivity.kt app/src/main/java/com/propdf/editor/ui/viewer/ViewerActivity.kt
          cp ViewerViewmodel.kt app/src/main/java/com/propdf/editor/ui/viewer/ViewerViewModel.kt
          cp PdfPageAdapter.kt app/src/main/java/com/propdf/editor/ui/viewer/PdfPageAdapter.kt
          cp AnnotatedPageView.kt app/src/main/java/com/propdf/editor/ui/viewer/AnnotatedPageView.kt
          cp AnnotationCanvasView.kt app/src/main/java/com/propdf/editor/ui/viewer/AnnotationCanvasView.kt

          # --- UI/Tools ---
          cp ToolsActivity.kt app/src/main/java/com/propdf/editor/ui/tools/ToolsActivity.kt

          # --- UI/Scanner ---
          cp DocumentScannerActivity.kt app/src/main/java/com/propdf/editor/ui/scanner/DocumentScannerActivity.kt

          # --- App class ---
          cp ProPDFApp.kt app/src/main/java/com/propdf/editor/ProPDFApp.kt

          # --- UI/Main ---
          cp MainActivity.kt app/src/main/java/com/propdf/editor/ui/main/MainActivity.kt

          # --- Data/Repository ---
          cp AiSummaryManager.kt app/src/main/java/com/propdf/editor/data/repository/AiSummaryManager.kt
          cp OcrManager.kt app/src/main/java/com/propdf/editor/data/repository/OcrManager.kt
          cp PdfOperationsManager.kt app/src/main/java/com/propdf/editor/data/repository/PdfOperationsManager.kt
          cp SignatureManager.kt app/src/main/java/com/propdf/editor/data/repository/SignatureManager.kt
          [ -f PdfRendererHelper.kt ] && cp PdfRendererHelper.kt app/src/main/java/com/propdf/editor/data/repository/PdfRendererHelper.kt
          [ -f TextExtractor.kt ] && cp TextExtractor.kt app/src/main/java/com/propdf/editor/data/repository/TextExtractor.kt
          [ -f ScannerProcessor.kt ] && cp ScannerProcessor.kt app/src/main/java/com/propdf/editor/data/repository/ScannerProcessor.kt
          [ -f PdfRepository.kt ] && cp PdfRepository.kt app/src/main/java/com/propdf/editor/data/repository/PdfRepository.kt
          [ -f RecentFilesRepository.kt ] && cp RecentFilesRepository.kt app/src/main/java/com/propdf/editor/data/repository/RecentFilesRepository.kt

          # --- Data/Local ---
          cp RecentFileEntity.kt app/src/main/java/com/propdf/editor/data/local/RecentFileEntity.kt
          cp RecentFilesDao.kt app/src/main/java/com/propdf/editor/data/local/RecentFilesDao.kt
          cp RecentFilesDatabase.kt app/src/main/java/com/propdf/editor/data/local/RecentFilesDatabase.kt

          # --- DI ---
          cp AppModule.kt app/src/main/java/com/propdf/editor/di/AppModule.kt

          # --- Utils ---
          cp FileHelper.kt app/src/main/java/com/propdf/editor/utils/FileHelper.kt

          # --- Manifests / Gradle / Resources ---
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app_build.gradle app/build.gradle

          # Copy res files
          cp -r res/layout/* app/src/main/res/layout/ 2>/dev/null || true
          cp -r res/values/* app/src/main/res/values/ 2>/dev/null || true
          cp -r res/menu/* app/src/main/res/menu/ 2>/dev/null || true

          echo "Project structure setup complete"
          find app/src/main/java -name "*.kt" | sort

      - name: Verify ASCII compliance
        script: |
          find app/src/main/java -name "*.kt" | while read file; do
            non_ascii=$(python3 -c "
with open('$file', 'rb') as f:
    data = f.read()
count = sum(1 for b in data if b > 127)
print(count)
")
            if [ "$non_ascii" -gt 0 ]; then
              echo "ERROR: $file has $non_ascii non-ASCII bytes"
              exit 1
            else
              echo "OK: $file"
            fi
          done

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
